{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card mt-4">
            <div class="card-header-red">
                <h5 class="mb-0 fw-bold"><i class="fas fa-edit me-2"></i>Edit Patient — {{ patient.username }}</h5>
            </div>

         <p class="text-center mt-3 small text-muted">
                    <a href="/donor-dashboard/" style="color:#b71c1c;">← Back to Dashboard</a>
                </p>

            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="full_name" class="form-control" value="{{ patient.full_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" value="{{ patient.email }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Blood Group</label>
                            <select name="blood_group" class="form-select" required>
                                <option {% if patient.blood_group == 'A+' %}selected{% endif %}>A+</option>
                                <option {% if patient.blood_group == 'A-' %}selected{% endif %}>A-</option>
                                <option {% if patient.blood_group == 'B+' %}selected{% endif %}>B+</option>
                                <option {% if patient.blood_group == 'B-' %}selected{% endif %}>B-</option>
                                <option {% if patient.blood_group == 'AB+' %}selected{% endif %}>AB+</option>
                                <option {% if patient.blood_group == 'AB-' %}selected{% endif %}>AB-</option>
                                <option {% if patient.blood_group == 'O+' %}selected{% endif %}>O+</option>
                                <option {% if patient.blood_group == 'O-' %}selected{% endif %}>O-</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="age" class="form-control" value="{{ patient.age }}" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Doctor Name</label>
                            <input type="text" name="doctor_name" class="form-control" value="{{ patient.doctor_name }}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hospital</label>
                            <input type="text" name="hospital" class="form-control" value="{{ patient.hospital }}" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" name="phone" class="form-control" value="{{ patient.phone }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2">{{ patient.address }}</textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn-red px-4 py-2">Save Changes</button>
                        <a href="/management/patients/" class="btn-outline-red px-4 py-2 text-decoration-none">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
