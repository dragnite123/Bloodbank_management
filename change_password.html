{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4">
            <div class="card-header-red text-center">
                <i class="fas fa-lock fa-2x mb-2"></i>
                <h4 class="mb-0 fw-bold">Change Password</h4>
                <small style="opacity:0.8;">{{ user.username }}</small>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                <div class="mb-3">
            <button onclick="history.back()" class="btn btn-secondary">
                <i class="fas fa-arrow-left me-2"></i>Back
            </button>

                    <div class="mb-3">
                        <label class="form-label">Current Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="current_password" class="form-control" placeholder="Current Password" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" name="new_password" class="form-control" placeholder="Min 6 characters" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-key"></i></span>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm New Password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-red w-100 py-2">
                        <i class="fas fa-save me-2"></i>Change Password
                    </button>
                </form>
                <p class="text-center mt-3 small text-muted">
                    <a href="{{ back_url }}" style="color:#b71c1c;">← Back to Dashboard</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
