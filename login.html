{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 mt-5">
            <h3 class="text-center text-danger mb-4"><i class="fas fa-sign-in-alt me-2"></i>Login</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-danger w-100">Login</button>

                <p class="text-center mt-2 small text-muted">
    <a href="/forgot-password/" style="color:#b71c1c;">Forgot Password?</a>
</p>    

            </form>
            <hr>
            <p class="text-center text-muted small">
                Register as <a href="/register/donor/">Donor</a> or <a href="/register/patient/">Patient</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
