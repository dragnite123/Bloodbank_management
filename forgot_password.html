{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card mt-4">
            <div class="card-header-red text-center">
                <i class="fas fa-key fa-2x mb-2"></i>
                <h4 class="mb-0 fw-bold">Forgot Password</h4>
                <small style="opacity:0.8;">Reset your password using your email</small>
            </div>

 <p class="text-center mt-3 small text-muted">
                    <a href="/donor-dashboard/" style="color:#b71c1c;">← Back to Dashboard</a>
                </p>

            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Your Username" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Registered Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="new_password" class="form-control" placeholder="New Password" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirm New Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm Password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-red w-100 py-2">
                        <i class="fas fa-key me-2"></i>Reset Password
                    </button>
                </form>
                <p class="text-center mt-3 small text-muted">
                    Remember password? <a href="/login/" style="color:#b71c1c;">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
